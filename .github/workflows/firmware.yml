name: Firmware

on:
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create ESP32 secrets stub
        run: cp firmware/esp32/include/secrets.h.example firmware/esp32/include/secrets.h

      - name: Build ESP32 firmware
        run: pio run --project-dir firmware/esp32

      - name: Build Mega firmware
        run: pio run --project-dir firmware/mega
