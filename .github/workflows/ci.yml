name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'data/**'
              - 'scripts/build_presidential_2026_data.py'
              - 'scripts/deploy_presidential_backend.py'
              - 'cloudbuild.yaml'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy-web.yml'
              - 'firebase.json'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: community_test
          POSTGRES_USER: community_test
          POSTGRES_PASSWORD: community_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community_test -d community_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Ruff
        run: uv run ruff check . ../scripts/build_presidential_2026_data.py ../scripts/deploy_presidential_backend.py

      - name: Mypy
        run: uv run mypy app/

      - name: Pytest
        env:
          COMMUNITY_TEST_POSTGRES_URL: postgresql+psycopg://community_test:community_test@localhost:5432/community_test
        run: uv run pytest

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test web analytics pipeline
        run: flutter test --platform chrome test/analytics_default_pipeline_web_test.dart

      - name: Build web (smoke test)
        run: >-
          flutter build web --release --no-web-resources-cdn
          --dart-define=IOT_FEATURE_ENABLED=false
          --dart-define=POLITICIAN_FOLLOW_ENABLED=false
          --dart-define=ANALYTICS_ENABLED=true
          --dart-define=PUBLIC_APP_URL=https://example.invalid
          --dart-define=PRIVACY_CONTROLLER_NAME="Responsável de Teste"
          --dart-define=PRIVACY_CONTACT_EMAIL=privacidade@example.invalid
