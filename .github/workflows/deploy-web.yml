name: Deploy Web

on:
  workflow_run:
    workflows: ['Deploy Backend']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get
        working-directory: mobile

      - name: Build web release
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://fpolitico.com.br' }}
        run: flutter build web --release --dart-define=IOT_FEATURE_ENABLED=false --dart-define=PUBLIC_APP_URL="$PUBLIC_APP_URL"
        working-directory: mobile

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: farol-politico-495210
          channelId: live
