name: guia_eleitoral
description: Guia Eleitoral Brasil 2026 - Voting advice application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  firebase_analytics: ^12.3.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  mobile_scanner: 7.2.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  firebase_analytics_platform_interface: ^5.1.1
  firebase_core_platform_interface: ^6.0.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/fonts/OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Inter-SOURCES.md
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/Roboto-SOURCES.md
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
