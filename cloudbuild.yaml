steps:
  # 1. Build com BuildKit (cache do uv via --mount=cache)
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest
      - .

  # 2. Push de todas as tags pro Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend

  # 3. Aplicar migrations Alembic contra o Neon Postgres
  - name: '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID'
    entrypoint: 'sh'
    args: ['-c', 'cd /app && alembic upgrade head']
    secretEnv: ['DATABASE_URL']
    env:
      - 'DATA_DIR=/data'
      - 'APP_ENV=prod'

  # 4. Deploy da nova revisão no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - farol-politico-api
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=60s
      - --port=8080
      - --set-env-vars=DATA_DIR=/data,APP_ENV=prod
      - --set-secrets=DATABASE_URL=database-url:latest,GNEWS_API_KEY=gnews-api-key:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/gnews-api-key/versions/latest
      env: 'GNEWS_API_KEY'

substitutions:
  _REGION: us-east4
  _REPO: farol-politico

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
