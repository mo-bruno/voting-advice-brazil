steps:
  # Build com BuildKit habilitado (necessário pra --mount=cache no Dockerfile)
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - farol-politico-api
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=DATA_DIR=/data
      - --set-secrets=DATABASE_URL=database-url:latest
      - --add-cloudsql-instances=$PROJECT_ID:$_REGION:$_SQL_INSTANCE

substitutions:
  _REGION: us-east4
  _REPO: farol-politico
  _SQL_INSTANCE: farol-politico-db

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
