steps:
  # 1. Build com BuildKit (cache do uv via --mount=cache)
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest
      - .

  # 2. Push de todas as tags pro Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend

  # 3. Migração aditiva; a revisão antiga ainda lê somente os dados já existentes.
  - name: '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID'
    entrypoint: 'sh'
    args: ['-c', 'cd /app && alembic upgrade head']
    secretEnv: ['DATABASE_URL']
    env:
      - 'DATA_DIR=/data'
      - 'APP_ENV=prod'

  # 4. Publicar filtros antes de adicionar 2026. Preserva o ano em produção;
  #    uma revisão legada sem ACTIVE_ELECTION_YEAR equivale a 2022.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: python3
    args:
      - scripts/deploy_presidential_backend.py
      - bridge
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID
      - --region=$_REGION

  # 5. A ponte já recebe 100% do tráfego e exclui eleições diferentes.
  - name: '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID'
    entrypoint: 'sh'
    args: ['-c', 'cd /app && python -m app.infrastructure.database.seed']
    secretEnv: ['DATABASE_URL']
    env:
      - 'DATA_DIR=/data'
      - 'APP_ENV=prod'
      - 'ACTIVE_ELECTION_YEAR=2026'
      - 'ACTIVE_ELECTION_OFFICE=presidente'

  # 6. Ativar explicitamente 2026 após o sucesso da carga.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: python3
    args:
      - scripts/deploy_presidential_backend.py
      - activate
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$BUILD_ID
      - --region=$_REGION

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: 'DATABASE_URL'

substitutions:
  _REGION: us-east4
  _REPO: farol-politico

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
